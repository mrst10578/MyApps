plugins { id 'com.android.application' }

android {
    namespace 'ir.haftehnegar.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.haftehnegar.app'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.1.1'
    }
    signingConfigs {
        production {
            def keyPath = System.getenv('HAFTEH_KEYSTORE_PATH')
            if (keyPath != null && !keyPath.isEmpty()) {
                storeFile file(keyPath)
                storePassword System.getenv('HAFTEH_STORE_PASSWORD')
                keyAlias System.getenv('HAFTEH_KEY_ALIAS')
                keyPassword System.getenv('HAFTEH_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { }
        release {
            minifyEnabled false
            if (System.getenv('HAFTEH_KEYSTORE_PATH')) {
                signingConfig signingConfigs.production
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

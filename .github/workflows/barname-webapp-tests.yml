name: Barname WebApp Tests
on:
  pull_request:
    paths: ['webapp/**', '.github/workflows/barname-webapp-tests.yml']
  push:
    branches: [main]
    paths: ['webapp/**', '.github/workflows/barname-webapp-tests.yml']
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test offline storage and migration
        run: node webapp/tests/storage-regression.cjs
      - name: Test safe JSON backup import
        run: node webapp/tests/import-regression.cjs
      - name: Test safe archive save after export
        run: node webapp/tests/archive-save-regression.cjs
      - name: Test mobile library pinning and Persian search
        run: node webapp/tests/library-regression.cjs
      - name: Test archive previews and duplicate lineage
        run: node webapp/tests/archive-preview-regression.cjs
      - name: Test advanced theme designer and contrast
        run: node webapp/tests/theme-designer-regression.cjs
      - name: Test cell repeat actions and undo
        run: node webapp/tests/cell-repeat-regression.cjs
